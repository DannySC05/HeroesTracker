services:
  - type: web
    name: heroes-tracker-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @heroes-tracker/backend build
    startCommand: pnpm --filter @heroes-tracker/backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: BCRYPT_ROUNDS
        value: '12'
      - key: CORS_ORIGINS
        sync: false
      - key: COMICVINE_API_KEY
        sync: false
